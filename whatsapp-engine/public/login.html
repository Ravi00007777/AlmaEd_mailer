<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlmaED Sign In</title>
<style>
  :root { --plum: #561132; --mag: #A3285A; --gold: #F7C766; --ink: #1E0A14; --bg: #FAF6F3; --card: #FFFFFF; --line: #EADFE3; --muted: #7A6670; --bad: #C0392B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  header { background: linear-gradient(120deg, var(--plum), var(--mag)); color: #fff; padding: 18px 24px; }
  h1 { font-size: 20px; margin: 0; font-weight: 700; } h1 span { color: var(--gold); }
  .body { padding: 24px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); }
  input:focus { outline: 2px solid var(--mag); outline-offset: 1px; }
  button { font-size: 16px; font-weight: 700; padding: 12px; border-radius: 12px; border: 0; cursor: pointer; color: #fff; background: var(--mag); }
  .err { color: var(--bad); font-size: 14px; margin: 0; }
  details { font-size: 14px; color: var(--muted); } summary { cursor: pointer; color: var(--mag); font-weight: 600; } details p { margin: 8px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <header><h1>AlmaED <span>WhatsApp</span></h1></header>
  <div class="body">
    <p class="err" id="err" hidden role="alert">Wrong user ID or password.</p>
    <label>User ID <input type="text" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <details>
      <summary>Forgot password?</summary>
      <p>The password is set in Vercel. Open your project → <b>Settings → Environment Variables</b>, edit <code>DASHBOARD_PASSWORD</code>, then <b>Deployments → ⋯ → Redeploy</b>. Sign in with the new password.</p>
    </details>
  </div>
</form>
<script>if (location.search.includes('error')) document.getElementById('err').hidden = false;</script>
</body>
</html>
